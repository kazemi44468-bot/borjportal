name: Validate JavaScript
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check shared and page scripts
        run: |
          node --check assets/js/app.js
          find . -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check
          node - <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('towers/negin-piroozi2.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)]
            .map(match => match[1]).filter(script => script.trim());
          for (const [index, script] of scripts.entries()) {
            new vm.Script(script, { filename: `negin-piroozi2.inline-${index}.js` });
          }
          if (!scripts.length) throw new Error('No inline scripts found in resident portal');
          console.log(`Validated ${scripts.length} inline script(s) in resident portal.`);
          NODE
      - name: Validate Cloudflare D1 migrations
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          db.executescript(Path('backend/worker/migrations/0001_core.sql').read_text())
          db.executescript(Path('backend/worker/migrations/0002_operations.sql').read_text())
db.executescript(Path('backend/worker/migrations/0003_advanced_operations.sql').read_text())
          violations = db.execute('PRAGMA foreign_key_check').fetchall()
          if violations:
              raise SystemExit(f'Foreign key violations: {violations}')
          tables = db.execute("SELECT count(*) FROM sqlite_master WHERE type='table'").fetchone()[0]
          print(f'Validated D1 migrations and {tables} tables.')
          PY
