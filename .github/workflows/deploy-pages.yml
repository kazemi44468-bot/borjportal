name: Deploy برج پورتال to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate site entry and local assets
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/css/style.css
          test -s assets/js/app.js
          test -f .nojekyll
          grep -q 'assets/css/style.css' index.html
          grep -q 'assets/js/app.js' index.html
          echo "Root entry and core assets are present."
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
