<!doctype html><html><head><meta charset="utf-8"><title>diagnostic</title></head><body><pre id="out">loading</pre><script>(async()=>{const out=document.getElementById('out');try{const r=await fetch('./assets/js/app.js?diag='+Date.now());const t=await r.text();out.textContent='HTTP '+r.status+' · '+t.length+' chars · ';try{new Function(t);out.textContent+='SYNTAX OK'}catch(e){out.textContent+='SYNTAX ERROR: '+e.name+': '+e.message+'\n'+(e.stack||'')}}catch(e){out.textContent='FETCH ERROR: '+e.message}})();</script></body></html>
